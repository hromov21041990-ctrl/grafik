<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>График смен 2.0</title><style>*{box-sizing:border-box}body{font:15px system-ui;background:#f6f7fa;color:#222;margin:0}main{max-width:1100px;margin:auto;padding:16px}section,.day{background:white;border:1px solid #e3e3ec;border-radius:14px;padding:18px;margin:12px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #d4d4df;border-radius:9px;max-width:100%}input,select,textarea{width:100%}label{display:block;margin:10px 0 5px;color:#555}button{cursor:pointer}button.primary{background:#6656ec;color:white;border-color:#6656ec}.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:135px}.hide{display:none!important}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.day{margin:0;padding:10px;min-width:0}.slot{background:#f4f4fa;padding:8px;border-radius:8px;margin:8px 0;font-size:12px}.busy{background:#e7f7ec}.off{background:#eee}.muted{color:#777}.error{color:#b22}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}@media(max-width:700px){.calendar{grid-template-columns:repeat(2,1fr)}}</style><main><h1>График смен 2.0 <small class="muted">Бета</small></h1><p class="muted">Для ПВЗ, магазинов и небольших торговых точек</p><section id="auth"><button onclick="mode(false)">Создать точку</button> <button onclick="mode(true)">Войти</button><div id="reg"><h2>Регистрация точки</h2><div class="row"><div><label>Название точки</label><input id="name" placeholder="Мой магазин"></div><div><label>Код точки латиницей</label><input id="code" placeholder="my-shop"></div></div><div class="row"><div><label>Пароль владельца (10+ символов)</label><input id="ownerPass" type="password"></div><div><label>Пароль сотрудника (10+ символов)</label><input id="staffPass" type="password"></div></div><div class="row"><div><label>Количество сотрудников</label><input id="count" type="number" min="1" max="50" value="6" onchange="namesFill()"></div><div><label>Человек в смене</label><input id="positions" type="number" min="1" max="10" value="2"></div><div><label>Открытие</label><input id="opens" type="time" value="10:00"></div><div><label>Закрытие</label><input id="closes" type="time" value="22:00"></div></div><label>Имена сотрудников (каждый с новой строки)</label><textarea id="names" rows="5"></textarea><label>Рабочие дни</label><div id="days"></div><div class="row"><div><label>Ставка за смену, ₽</label><input id="shift" type="number" value="3000"></div><div><label>Ставка за час, ₽</label><input id="hour" type="number" value="200"></div></div><p><button class="primary" onclick="register()">Создать точку</button></p></div><div id="signin" class="hide"><h2>Вход</h2><label>Код точки</label><input id="signinCode"><label>Роль</label><select id="role"><option value="owner">Владелец</option><option value="staff">Сотрудник</option></select><label>Пароль</label><input id="pass" type="password"><p><button class="primary" onclick="login()">Войти</button></p></div><p id="error" class="error"></p></section><div id="app" class="hide"><section><button style="float:right" onclick="logout()">Выйти</button><h2 id="company"></h2><p id="summary" class="muted"></p><label>Неделя</label><input id="week" type="date" onchange="draw()"><p id="status"></p></section><div class="calendar" id="calendar"></div><section><h2>Назначить сотрудника</h2><div class="row"><div><label>Дата</label><input id="date" type="date"></div><div><label>Место</label><select id="position"></select></div><div><label>Сотрудник</label><select id="employee"></select></div><div><label>Оплата</label><select id="kind"><option value="shift">За смену</option><option value="hour">Почасовая</option></select></div><div><label>С</label><input id="start" type="time"></div><div><label>До</label><input id="end" type="time"></div></div><p><button class="primary" onclick="assign()">Назначить</button></p></section><section id="owner" class="hide"><h2>Настройки точки</h2><div class="row"><div><label>Название</label><input id="editName"></div><div><label>Человек в смене</label><input id="editPositions" type="number" min="1" max="10"></div><div><label>Открытие</label><input id="editOpens" type="time"></div><div><label>Закрытие</label><input id="editCloses" type="time"></div><div><label>Ставка за смену</label><input id="editShift" type="number"></div><div><label>Ставка за час</label><input id="editHour" type="number"></div></div><label>Рабочие дни</label><div id="editDays"></div><label>Сотрудники — можно добавлять и удалять</label><textarea id="editNames" rows="5"></textarea><p><button class="primary" onclick="settings()">Сохранить настройки</button></p><h2>Еженедельные выплаты</h2><div id="pay"></div></section></div></main><script>
const API='https://vyavhynnybsinkiievbu.supabase.co/functions/v1/pvz-v2',KEY='sb_publishable_eIWwXJEBGxYAbnhOc-MKfw_NitfQtB_',E=id=>document.getElementById(id);let token=sessionStorage.getItem('pvz2token')||'',s=null;
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),add=(v,n)=>{let d=new Date(v+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)},monday=v=>add(v,-(new Date(v+'T12:00:00').getDay()+6)%7),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rub=n=>Number(n).toLocaleString('ru-RU')+' ₽';
const days=id=>[...E(id).querySelectorAll('input:checked')].map(x=>+x.value),dayUI=(id,checked)=>E(id).innerHTML=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((x,i)=>'<label style="display:inline-block"><input type="checkbox" value="'+i+'" '+(checked.includes(i)?'checked':'')+'>'+x+'</label> ').join(''),list=id=>E(id).value.split('\n').map(x=>x.trim()).filter(Boolean);
function mode(b){E('reg').classList.toggle('hide',b);E('signin').classList.toggle('hide',!b);E('error').textContent=''}function namesFill(){let old=list('names'),n=Math.min(50,Math.max(1,+E('count').value||1));E('names').value=Array.from({length:n},(_,i)=>old[i]||'Сотрудник '+(i+1)).join('\n')}
async function api(action,p={}){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({action,...p})});let v=await r.json();if(!r.ok)throw Error(v.error||'Ошибка сервера');return v}
async function register(){try{let r=await api('register',{name:E('name').value,code:E('code').value.trim().toLowerCase(),ownerPassword:E('ownerPass').value,staffPassword:E('staffPass').value,employees:list('names'),config:{positions:+E('positions').value,opens:E('opens').value,closes:E('closes').value,days:days('days')},rates:{shift:+E('shift').value,hour:+E('hour').value}});enter(r)}catch(e){E('error').textContent=e.message}}
async function login(){try{enter(await api('login',{code:E('signinCode').value.trim().toLowerCase(),role:E('role').value,password:E('pass').value}))}catch(e){E('error').textContent=e.message}}
function enter(r){token=r.token||token;sessionStorage.setItem('pvz2token',token);s=r.company;E('auth').classList.add('hide');E('app').classList.remove('hide');E('week').value=monday(iso(new Date()));E('date').value=iso(new Date());fill();draw()}
function fill(){E('editName').value=s.name;E('editPositions').value=s.config.positions;E('editOpens').value=s.config.opens;E('editCloses').value=s.config.closes;E('editShift').value=s.rates.shift;E('editHour').value=s.rates.hour;E('editNames').value=s.employees.join('\n');dayUI('editDays',s.config.days)}
async function reload(){let r=await api('load');s=r.company;draw()}
function draw(){if(!s)return;E('company').textContent=s.name;E('summary').textContent=s.employees.length+' сотрудников, '+s.config.positions+' мест в смене, '+s.config.opens+'–'+s.config.closes;E('owner').classList.toggle('hide',s.role!=='owner');E('employee').innerHTML=s.employees.map((x,i)=>'<option value="'+i+'">'+esc(x)+'</option>').join('');E('position').innerHTML=Array.from({length:s.config.positions},(_,i)=>'<option value="'+i+'">Место '+(i+1)+'</option>').join('');E('start').value=s.config.opens;E('end').value=s.config.closes;const start=monday(E('week').value||iso(new Date()));E('calendar').innerHTML=Array.from({length:7},(_,i)=>{const d=add(start,i),day=(new Date(d+'T12:00:00').getDay()+6)%7,open=s.config.days.includes(day);return '<div class="day '+(open?'':'off')+'"><b>'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][day]+' '+d.slice(8)+'.'+d.slice(5,7)+'</b>'+(open?Array.from({length:s.config.positions},(_,p)=>{let r=s.schedule.find(x=>x.date===d&&x.position===p);return '<div class="slot '+(r?'busy':'')+'">Место '+(p+1)+'<br>'+(r?esc(r.employee)+'<br>'+r.start+'–'+r.end+'<br>'+rub(r.pay)+(s.role==='owner'?'<br><button onclick="removeShift(\''+r.id+'\')">Снять</button>':''):'Свободно')+'</div>'}).join(''):'Выходной')+'</div>'}).join('');if(s.role==='owner'){E('pay').innerHTML='<table><tr><th>Сотрудник</th><th>Начислено</th><th>Статус</th></tr>'+s.employees.map(n=>{let sum=s.schedule.filter(x=>x.date>=start&&x.date<=add(start,6)&&x.employee===n).reduce((a,x)=>a+x.pay,0);return '<tr><td>'+esc(n)+'</td><td>'+rub(sum)+'</td><td>'+(s.payments[start+'|'+n]?'Выплачено':'<button onclick="paid(\''+encodeURIComponent(n)+'\')">Отметить</button>')+'</td></tr>'}).join('')+'</table>'}}
async function mutate(action,p){try{let r=await api(action,{...p,expectedVersion:s.version});s=r.company;draw();E('status').textContent='Сохранено'}catch(e){E('status').textContent=e.message}}
function assign(){mutate('assign',{date:E('date').value,position:+E('position').value,employeeIndex:+E('employee').value,kind:E('kind').value,start:E('start').value,end:E('end').value})}
function removeShift(id){if(confirm('Снять сотрудника со смены?'))mutate('remove',{id})}
function settings(){mutate('settings',{name:E('editName').value,employees:list('editNames'),config:{positions:+E('editPositions').value,opens:E('editOpens').value,closes:E('editCloses').value,days:days('editDays')},rates:{shift:+E('editShift').value,hour:+E('editHour').value}})}
function paid(n){mutate('paid',{week:monday(E('week').value),employee:decodeURIComponent(n)})}
function logout(){let old=token;token='';sessionStorage.removeItem('pvz2token');s=null;E('app').classList.add('hide');E('auth').classList.remove('hide');mode(true);if(old)fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+old},body:JSON.stringify({action:'logout'})}).catch(()=>{})}
dayUI('days',[0,1,2,3,4,5,6]);namesFill();if(token)api('load').then(enter).catch(logout);
</script></html>
